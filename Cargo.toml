[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Engineering Team"]
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2.0"
anyhow = "1.0"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono", "time"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
aws-sdk-s3 = "1.71"
aws-config = "1.5"
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "util", "timeout"] }
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
uuid = { version = "1.12", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
dotenvy = "0.15"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9.3"
sha2 = "0.10"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
url = { version = "2.5", features = ["serde"] }